name: REP STRIVE Runner Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check REP STRIVE Runner availability
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_URL="https://repfitness.com/products/rep-strive-series-curved-treadmill"
          JSON_URL="${PRODUCT_URL}.js"
          VARIANT_ID="43288603099294"

          json="$(curl --fail --silent --show-error --location --max-time 20 \
            --retry 2 --retry-delay 2 \
            -H 'User-Agent: Mozilla/5.0' \
            "$JSON_URL")"

          variant_found="$(printf '%s' "$json" | jq -r --argjson id "$VARIANT_ID" '[.variants[] | select(.id == $id)] | length')"
          available="$(printf '%s' "$json" | jq -r --argjson id "$VARIANT_ID" '[.variants[] | select(.id == $id) | .available][0] // false')"

          echo "variant_found=$variant_found" >> "$GITHUB_OUTPUT"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "REP STRIVE variant_found=$variant_found available=$available"

      - name: Push emergency alert via Pushover
        if: steps.check.outputs.variant_found == '1' && steps.check.outputs.available == 'true'
        shell: bash
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 20 \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=REP STRIVE Runner AVAILABLE" \
            --form-string "message=The exact REP STRIVE Runner Shopify variant is reporting available. Tap to check/buy now." \
            --form-string "priority=2" \
            --form-string "retry=30" \
            --form-string "expire=3600" \
            --form-string "url=https://repfitness.com/products/rep-strive-series-curved-treadmill?variant=43288603099294" \
            --form-string "url_title=CHECK / BUY REP STRIVE" \
            https://api.pushover.net/1/messages.json
